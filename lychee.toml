# Markdown link and anchor checker, run by `mise run docs:check`. For a flaky host, extend
# `accept` or add a narrow `exclude` regex; never silence the whole gate.

# An enum, not a bool: a bool is a startup error on lychee 0.24+ (pinned: 0.24.2).
# `anchor-only`, not `full`: text fragments (`#:~:text=…`) tie the gate to third-party prose.
include_fragments = "anchor-only"

# `.lycheecache` is gitignored. 5xx responses are not cached, so a one-off outage does not fail
# the gate for a day.
cache = true
max_cache_age = "1d"
cache_exclude_status = "500.."

timeout = 20
retry_wait_time = 2
max_retries = 2
max_redirects = 10
host_request_interval = "100ms"

# 429: rate-limited, but the URL is real.
accept = ["200..=299", "429"]

# Prints the source file and line of each broken link.
format = "detailed"

# Regexes matched against the full URL; name the host and the reason for each.
exclude = [
  # This repository is private until publication: unauthenticated requests get 404.
  # Remove this entry when the repository goes public, but keep one for
  # `/(compare|releases/tag)/` URLs: the curated CHANGELOG.md links to the new tag before it is
  # pushed (cog.toml release sequence, steps 3 and 4).
  "^https://github\\.com/michal-b-bozek/rdp-primary-monitor(/|$)",
]

exclude_path = ["node_modules", "build", "dist"]

no_progress = true
