# SPDX-License-Identifier: MIT
# RDP Primary Monitor — pinned dev tools and quality tasks.
# Nothing here ships in the extension: the zip holds plain JavaScript, metadata and the schema.
# Gate tasks are added as the thing they check lands — no placeholder tasks that always pass.
# schemas:check and pack use host tools (glib2, GNOME Shell) that mise cannot pin; so do the test
# task (gjs) and spdx:check (libmagic, loaded by reuse).

# The oldest mise verified to read and write mise.lock (lock format v2) and the locked
# dependencies of the pipx tool (.mise/locks/); an older one may install them unlocked.
min_version = "2026.10.3"

[settings]
lockfile = true
# Supply-chain hardening — refuse releases younger than a week. Override one invocation with
# MISE_MINIMUM_RELEASE_AGE=0 in an emergency.
minimum_release_age = "168h"

[tools]
# Dev tools only. Exact pins; bump through a
# reviewed build(deps) commit. pnpm must match package.json "packageManager".
node = "24.21.0"
pnpm = "12.8.2"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
lefthook = "2.1.15"
lychee = "0.24.2"
# aqua's taplo package publishes no checksums, so mise.lock pins taplo by URL only.
taplo = "0.10.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
# reuse (spdx:check) is a Python package: mise installs it with uv into the pinned Python and
# locks its dependencies, with hashes, in .mise/locks/. Every reuse 6.x wheel is pure Python but
# tagged cp310-cp310-manylinux_2_41_x86_64 (a packaging quirk), and mise installs wheels only
# (uv --no-build), so reuse needs CPython 3.10 and installs only on x86-64 Linux with glibc 2.41
# or later. CPython 3.10 is end of life from October 2026; move to a supported Python when reuse
# ships a py3-none-any wheel. The pin also puts this Python on PATH inside the repository.
uv = "0.12.23"
python = "3.10.22"
"pipx:reuse" = "6.2.0"

[env]
# Dev tools installed by pnpm (package.json) run from the project, never from a global install.
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks."deps:install"]
description = "Install the pinned dev dependencies from pnpm-lock.yaml (frozen)"
run = "pnpm install --frozen-lockfile"

[tasks."hooks:install"]
description = "Install the git hooks from lefthook.yml (once per clone)"
run = "lefthook install"

[tasks."format:check"]
description = "Check formatting without changing files (Prettier; TOML: taplo; shell: shfmt)"
run = [
  "prettier --check .",
  "taplo fmt --check",
  "shfmt --diff .mise/tasks tools",
]

[tasks."format:fix"]
description = "Rewrite files to match the formatters"
run = ["prettier --write .", "taplo fmt", "shfmt --write .mise/tasks tools"]

[tasks.lint]
description = "Lint JavaScript (ESLint, eslint.config.js), TOML (taplo) and shell (ShellCheck, .shellcheckrc)"
# bash, not sh: the shell step needs pipefail, which dash (sh on Debian) lacks.
shell = "bash -o errexit -o pipefail -c"
run = [
  "eslint --max-warnings=0 .",
  "taplo lint --no-schema",
  # shfmt lists the shell files, extensionless mise file tasks included, by shebang; an empty
  # first listing fails the task instead of checking nothing.
  "files=\"$(shfmt --find .mise/tasks tools)\"; [[ -n \"$files\" ]] || { echo 'error: shfmt found no shell files under .mise/tasks or tools' >&2; exit 66; }; shfmt --find=0 .mise/tasks tools | xargs -0 shellcheck",
]

[tasks.typecheck]
description = "Type-check the JavaScript against the GNOME Shell 49 and 50 types"
depends = ["typecheck:49", "typecheck:50"]

# One tsc program per GNOME Shell release; .mise/tasks/typecheck/release runs it and checks
# that the program loaded no other release's types.
[tasks."typecheck:49"]
description = "Type-check against the GNOME Shell 49 types (tsc, tsconfig.json)"
run = [{ task = "typecheck:release 49" }]

[tasks."typecheck:50"]
description = "Type-check against the GNOME Shell 50 types (tsc, tsconfig.gnome50.json)"
run = [{ task = "typecheck:release 50" }]

[tasks.test]
description = "Run the tests in GJS (tests/run.js, the host's gjs)"
run = "gjs -m tests/run.js"

[tasks."schemas:check"]
description = "Check the GSettings schema strictly without writing a compiled one (glib-compile-schemas, from the host's glib2)"
run = "glib-compile-schemas --strict --dry-run src/schemas"

[tasks.pack]
description = "Pack the extension into build/<uuid>.shell-extension.zip (gnome-extensions, from the host's GNOME Shell)"
# gnome-extensions pack (GNOME Shell 49.10) segfaults when the --out-dir does not exist.
run = [
  "mkdir -p build",
  "gnome-extensions pack src --extra-source=lib --out-dir=build --force",
]

[tasks."spdx:check"]
description = "Check that every file has copyright and licence information (reuse lint, REUSE.toml)"
run = "reuse lint"

[tasks."docs:check"]
description = "Check Markdown links and anchors (lychee, lychee.toml)"
run = "lychee ."

[tasks."commits:check"]
description = "Check every commit message against Conventional Commits (cocogitto, cog.toml)"
run = "cog check"

[tasks."secrets:scan"]
description = "Scan the git history and the working tree for secrets (gitleaks)"
run = [
  "gitleaks git --no-banner --redact .",
  "gitleaks dir --no-banner --redact .",
]

[tasks."pins:check"]
description = "Check that package.json pins the same node and pnpm as mise.toml"
run = '''
want="$(mise current node)"; got="$(node -p "require('./package.json').engines.node")"
[ "$got" = "$want" ] || { printf 'error: package.json engines.node is %s, mise.toml pins node %s\n' "$got" "$want" >&2; exit 65; }
want="pnpm@$(mise current pnpm)"; got="$(node -p "require('./package.json').packageManager")"
[ "$got" = "$want" ] || { printf 'error: package.json packageManager is %s, mise.toml pins %s\n' "$got" "$want" >&2; exit 65; }
'''

[tasks.check]
description = "Run the local quality gates"
depends = [
  "format:check",
  "lint",
  "typecheck",
  "test",
  "schemas:check",
  "spdx:check",
  "pins:check",
  "docs:check",
  "commits:check",
  "secrets:scan",
]
run = "echo 'quality gates passed'"
