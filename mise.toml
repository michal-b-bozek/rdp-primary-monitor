# RDP Primary Monitor — pinned dev tools and quality tasks.
# Nothing here ships in the extension: the zip holds plain JavaScript, metadata and the schema.
# Gate tasks are added as the thing they check lands — no placeholder tasks that always pass
# (typecheck is the exception: a no-op until src/ exists). test / schemas:check / pack /
# install:dev arrive with the code.

# mise.lock uses lock format v2; this is the oldest mise verified to read and write it.
min_version = "2026.9.14"

[settings]
lockfile = true
# Supply-chain hardening — refuse releases younger than a week. Override one invocation with
# MISE_MINIMUM_RELEASE_AGE=0 in an emergency.
minimum_release_age = "168h"

[tools]
# Dev tools only. Exact pins; bump through a
# reviewed build(deps) commit. pnpm must match package.json "packageManager".
node = "24.21.0"
pnpm = "12.8.2"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
lefthook = "2.1.15"
lychee = "0.24.2"
# aqua's taplo package publishes no checksums, so mise.lock pins taplo by URL only.
taplo = "0.10.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"

[env]
# Dev tools installed by pnpm (package.json) run from the project, never from a global install.
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks."deps:install"]
description = "Install the pinned dev dependencies from pnpm-lock.yaml (frozen)"
run = "pnpm install --frozen-lockfile"

[tasks."hooks:install"]
description = "Install the git hooks from lefthook.yml (once per clone)"
run = "lefthook install"

[tasks."format:check"]
description = "Check formatting without changing files (Prettier; TOML: taplo; shell: shfmt)"
run = [
  "prettier --check .",
  "taplo fmt --check",
  "shfmt --diff .mise/tasks tools",
]

[tasks."format:fix"]
description = "Rewrite files to match the formatters"
run = ["prettier --write .", "taplo fmt", "shfmt --write .mise/tasks tools"]

[tasks.lint]
description = "Lint JavaScript (ESLint, eslint.config.js), TOML (taplo) and shell (ShellCheck, .shellcheckrc)"
# bash, not sh: the shell step needs pipefail, which dash (sh on Debian) lacks.
shell = "bash -o errexit -o pipefail -c"
run = [
  "eslint --max-warnings=0 .",
  "taplo lint --no-schema",
  # shfmt lists the shell files, extensionless mise file tasks included, by shebang; an empty
  # first listing fails the task instead of checking nothing.
  "files=\"$(shfmt --find .mise/tasks tools)\"; [[ -n \"$files\" ]] || { echo 'error: shfmt found no shell files under .mise/tasks or tools' >&2; exit 66; }; shfmt --find=0 .mise/tasks tools | xargs -0 shellcheck",
]

[tasks.typecheck]
description = "Type-check the JavaScript against the GNOME Shell types (tsc, tsconfig.json; a no-op until src/ exists)"
run = "tsc -p tsconfig.json"

[tasks."docs:check"]
description = "Check Markdown links and anchors (lychee, lychee.toml)"
run = "lychee ."

[tasks."commits:check"]
description = "Check every commit message against Conventional Commits (cocogitto, cog.toml)"
run = "cog check"

[tasks."secrets:scan"]
description = "Scan the git history and the working tree for secrets (gitleaks)"
run = [
  "gitleaks git --no-banner --redact .",
  "gitleaks dir --no-banner --redact .",
]

[tasks."pins:check"]
description = "Check that package.json pins the same node and pnpm as mise.toml"
run = '''
want="$(mise current node)"; got="$(node -p "require('./package.json').engines.node")"
[ "$got" = "$want" ] || { printf 'error: package.json engines.node is %s, mise.toml pins node %s\n' "$got" "$want" >&2; exit 65; }
want="pnpm@$(mise current pnpm)"; got="$(node -p "require('./package.json').packageManager")"
[ "$got" = "$want" ] || { printf 'error: package.json packageManager is %s, mise.toml pins %s\n' "$got" "$want" >&2; exit 65; }
'''

[tasks.check]
description = "Run the local quality gates"
depends = [
  "format:check",
  "lint",
  "typecheck",
  "pins:check",
  "docs:check",
  "commits:check",
  "secrets:scan",
]
run = "echo 'quality gates passed'"
