# pnpm 12 reads its settings here and ignores them in .npmrc, which is for per-user registry auth
# only (~/.npmrc, never committed). Single package: no `packages:` list.

# engines.node becomes a hard install-time gate.
engineStrict: true
# Every `pnpm add` records an exact pin.
saveExact: true
autoInstallPeers: true
dedupePeerDependents: true
# Refuse versions younger than a week (in minutes), as mise.toml does.
minimumReleaseAge: 10080

allowBuilds:
  # Its postinstall fetches a native binding only when the optional @unrs/resolver-binding-*
  # package for the platform is missing; that package is present, so the build is denied.
  unrs-resolver: false

# Every @girs library in the lockfile is pinned to 4.9.0, the generation of the pinned
# @girs/gjs, so tsc sees one copy of GLib, Gio and GObject. @girs/gnome-shell 49.1.0 pulls
# several generations, and types from one copy are rejected by APIs typed with another
# (GLib.Variant into Gio.DBusProxy.call). Entries that resolve to 4.9.0 anyway are a guard
# against a later 4.x bringing a second generation back. A new @girs library in the lockfile gets
# an entry here; bump @girs/gjs in package.json together with this list.
# Trade-off: the base-library types (GLib, Gio, GObject 2.89, Gtk 4.23) are newer than GNOME 49's
# GLib 2.86 and Gtk 4.20, so tsc accepts base API that GNOME 49 may lack; the Shell-level types
# (meta, mtk, st, shell, clutter, cogl) stay their own release's.
# Re-evaluate when @girs/gnome-shell, @girs/gnome-shell-50 or @girs/gjs is bumped; drop the list
# once each set's types depend on one generation themselves.
overrides:
  '@girs/accountsservice-1.0': 4.9.0
  '@girs/adw-1': 4.9.0
  '@girs/atk-1.0': 4.9.0
  '@girs/cairo-1.0': 4.9.0
