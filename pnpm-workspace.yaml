# pnpm settings — strict defaults. The pinned pnpm 12 reads these here and ignores
# them in .npmrc, which is left for per-user registry auth only (~/.npmrc, never committed).
# Single package: no `packages:` list.

# engines.node becomes a hard install-time gate.
engineStrict: true
# Every `pnpm add` records an exact pin.
saveExact: true
autoInstallPeers: true
dedupePeerDependents: true
# Supply-chain cooldown, as in mise.toml: refuse versions younger than a week (minutes).
minimumReleaseAge: 10080

# Build-script gate. Each entry is a reviewed decision.
allowBuilds:
  # postinstall = napi-postinstall: fetches a native binding only when the optional
  # @unrs/resolver-binding-* package for the platform is missing. Not needed — denied.
  unrs-resolver: false

# Version unification (overrides): @girs/gnome-shell 49.1.0 depends on @girs libraries
# from three generations (its ranges resolved to beta.38 and beta.40, meta-17 pins rc.17) while
# @girs/gjs 4.9.0 pulls 4.9.0, so up to four copies of GLib, Gio and GObject (one per generation)
# were installed and types from one copy were rejected by APIs typed with another (GLib.Variant
# into Gio.DBusProxy.call). Every library that @girs/gnome-shell 49.1.0 lists is pinned to 4.9.0,
# the generation of the pinned @girs/gjs.
# Trade-off: the 4.9.0 base-library types (GLib, Gio, GObject 2.89, Gtk 4.23) are newer than
# GNOME 49's GLib 2.86 and Gtk 4.20, so tsc accepts base API that GNOME 49 may lack; the
# Shell-level types (meta, mtk, st, shell, clutter 17) stay GNOME 49's.
# Date: 2026-10-13. Bump @girs/gjs in package.json together with this list, which also pins it.
# Re-evaluate when @girs/gnome-shell or @girs/gjs is bumped, and drop the list once the GNOME 49
# types depend on one generation themselves.
overrides:
  '@girs/accountsservice-1.0': 4.9.0
  '@girs/adw-1': 4.9.0
  '@girs/atk-1.0': 4.9.0
  '@girs/clutter-17': 4.9.0
  '@girs/cogl-2.0': 4.9.0
  '@girs/gcr-4': 4.9.0
  '@girs/gdm-1.0': 4.9.0
  '@girs/gio-2.0': 4.9.0
  '@girs/giounix-2.0': 4.9.0
  '@girs/gjs': 4.9.0
  '@girs/glib-2.0': 4.9.0
  '@girs/gnomebg-4.0': 4.9.0
  '@girs/gnomebluetooth-3.0': 4.9.0
  '@girs/gnomedesktop-4.0': 4.9.0
  '@girs/gobject-2.0': 4.9.0
  '@girs/gtk-4.0': 4.9.0
  '@girs/gvc-1.0': 4.9.0
  '@girs/meta-17': 4.9.0
  '@girs/mtk-17': 4.9.0
  '@girs/polkit-1.0': 4.9.0
  '@girs/shell-17': 4.9.0
  '@girs/shew-0': 4.9.0
  '@girs/st-17': 4.9.0
  '@girs/upowerglib-1.0': 4.9.0
