# Only the SHA-pinned GitHub Actions; every bump is reviewed and merged by hand.
# mise.toml tools, mise itself, the Fedora images and pnpm-lock.yaml are bumped by hand in
# build(deps) commits.

version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers .github/workflows; the composite actions need their own entry.
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    # A 7-day cooldown, as mise's minimum_release_age (mise.toml).
    cooldown:
      default-days: 7
    # Minor and patch bumps share one pull request; a major bump gets its own.
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
    # "build(deps):" is a type cog.toml declares, so `cog check` accepts the commits.
    commit-message:
      prefix: build
      include: scope
