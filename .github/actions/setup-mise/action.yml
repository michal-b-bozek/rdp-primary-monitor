# The one place CI pins mise; workflows use it right after their checkout.

name: Set up mise
description: Trust the checkout, then install the pinned mise and the tools in mise.lock

runs:
  using: composite
  steps:
    # safe.directory: the checkout belongs to the runner's user and the container runs as root,
    # so cocogitto (libgit2) and gitleaks refuse the repository otherwise.
    # MISE_TRUSTED_CONFIG_PATHS: mise ignores an untrusted mise.toml.
    # $GITHUB_WORKSPACE, not github.workspace: in a container job the context holds the runner's
    # path, not the container's.
    - name: Trust the checkout
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        printf 'MISE_TRUSTED_CONFIG_PATHS=%s\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

    # With mise.lock present the action runs `mise install --locked`: a tool missing from the
    # lock fails.
    # version equals min_version in mise.toml (mise run pins:check).
    # sha256 is that of the linux-x64 binary (the same in the release's .tar.gz and .tar.zst);
    # recompute it when bumping the version.
    - name: Install mise and the pinned tools
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: 2026.10.3
        sha256: 8d48bc510b7d844fad0bc7156c0855c2a1e7230c51e498a7f6b63b021f8b57c5
