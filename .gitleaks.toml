# Run by `mise run secrets:scan` (part of `mise run check`) and the lefthook pre-commit hook;
# a finding blocks the commit. Exempt a reviewed false positive with a narrow allowlist entry
# naming the file and the reason; never broaden or disable a rule.

[extend]
useDefault = true

